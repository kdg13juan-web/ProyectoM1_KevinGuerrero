<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Paletas con Estilos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/">
</head>

<body class="dark">
  <header class="header">
    <div class="switch" id="themeToggle"></div>
  </header>

  <div class="container">
    <!-- Panel izquierdo -->
    <aside class="sidebar">
      <h2>Color FLy</h2>

      <label for="paletteSize">Tamaño de paleta:</label>
      <select id="paletteSize">
        <option value="6">6 colores</option>
        <option value="8">8 colores</option>
        <option value="9">9 colores</option>
      </select>

      <label for="format">Formato:</label>
      <select id="format">
        <option value="hsl">HSL</option>
        <option value="hex">HEX</option>
        <option value="rgb">RGB</option>
      </select>

      <label for="style">Tipo:</label>
      <select id="style">
        <option value="normal">Normal</option>
        <option value="pastel">Pastel</option>
        <option value="neon">Neón</option>
        <option value="joya">Joya</option>
        <option value="muted">Muted</option>
        <option value="tierra">Tierra</option>
        
      </select>
    <label for="colorBlindMode">Modo Daltonismo:</label>
      <select id="colorBlindMode">
        <option value="none">Normal</option>
        <option value="protanopia">Protanopia (Rojo-Ciego)</option>
        <option value="deuteranopia">Deuteranopia (Verde-Ciego)</option>
        <option value="tritanopia">Tritanopia (Azul-Amarillo-Ciego)</option>
        <option value="achromatopsia">Acromatopsia (Escala de Grises)</option>
      </select>


      <!-- Botones dinámicos -->
      <div id="styleButtons" class="style-buttons" style="display:none;">
        <button id="brightnessBtn">Brillo:</button>
        <button id="saturationBtn">Saturación:</button>
      </div>

      <button id="generateBtn">🎨 Generar Paleta</button>
      <button id="saveBtn">💾 Guardar Paleta</button>
    </aside>

    <!-- Panel central -->
    <main class="main">
      <h2 class="title">Generador Paletas De Colores</h2>
      <div class="palette" id="palette"></div>

    </main>
  </div>

  
  <!-- Panel inferior -->
   <article>

        <h2 class="title-saved-palettes">Paletas Guardadas</h2>
        <div class="saved-palettes" id="savedPalettes"></div>
    </article>

  <footer class="bottom">
        <p class="footer-hint">
            <span class="hint-text">Haz clic en un color para copiar.</span>
            <span class="hint-sep">·</span>
            <span class="hint-text">Presiona</span>
            <kbd class="footer-key">F5</kbd>
            <span class="hint-text">o usa el botón</span>
            <kbd class="footer-key">🎨 Generar Paleta</kbd>
            <span class="hint-sep">·</span>
            <span class="hint-text">Pulsa</span>
            <kbd class="footer-key">💾 Guardar</kbd>
            <span class="hint-text">Para guardar la paleta.</span>
        </p>


  </footer>

  <script src="JS/script.js"></script>
</body>
</html>
